    <script>
      // Environment constraint: HMR is disabled in AI Studio preview. Ignore WebSocket errors.
      window.addEventListener('error', function(e) {
        if (e && (e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('createWebSocketModuleRunnerTransport') !== -1) || e.filename && e.filename.indexOf('@vite/client') !== -1)) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var str = String(e && e.reason && (e.reason.message || e.reason.stack || e.reason) || '');
        if (str.indexOf('WebSocket') !== -1 || str.indexOf('createWebSocketModuleRunnerTransport') !== -1 || str.indexOf('@vite/client') !== -1) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
